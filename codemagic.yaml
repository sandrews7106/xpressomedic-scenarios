workflows:
  ios_release:
    name: iOS Release (Signed)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "SCEMS Protocols"

    environment:
      xcode: latest
      node: 20.11.1

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.xpressomedic.scenarioapp"

      vars:
        MARKETING_VERSION: "1.0.5"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Print environment
        script: |
          set -euo pipefail

          echo "MARKETING_VERSION=${MARKETING_VERSION:-}"
          echo "CM_BUILD_NUMBER=${CM_BUILD_NUMBER:-}"
          echo "BUILD_NUMBER=${BUILD_NUMBER:-}"

          node -v
          npm -v
          xcodebuild -version

          which pod || true
          pod --version || true

      - name: Compute Apple build number
        script: |
          set -euo pipefail

          BUILD_NUM="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-$(date +%s)}}"

          echo "BUILD_NUM=$BUILD_NUM"
          echo "BUILD_NUM=$BUILD_NUM" >> "$CM_ENV"

      - name: Install JS dependencies
        script: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync Capacitor iOS
        script: |
          set -euo pipefail

          npx cap sync ios

          echo "=== VERIFY CEDAR HOLLOW WEB ASSETS ==="

          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/map.html
          test -f ios/App/App/public/scenario.html
          test -f ios/App/App/public/css/style.css
          test -f ios/App/App/public/js/theme.js
          test -f ios/App/App/public/js/scenario.js
          test -f ios/App/App/public/js/scenarios-cedar-emtb.js
          test -f ios/App/App/public/js/scenarios-cedar-aemt.js
          test -f ios/App/App/public/js/scenarios-cedar-medic.js

          echo "Cedar Hollow assets verified."

          echo "=== VERIFY CURRENT APP COPY ==="
          grep -n "48 scenarios" ios/App/App/public/index.html || true
          grep -n "12 locations" ios/App/App/public/index.html || true
          grep -n "theme.js" ios/App/App/public/map.html || true
          grep -n "theme.js" ios/App/App/public/scenario.html || true

      - name: Install CocoaPods
        script: |
          set -euo pipefail

          cd ios/App

          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

          pod install --repo-update

      - name: Apply signing
        script: |
          set -euo pipefail

          xcode-project use-profiles

      - name: Clean Xcode DerivedData
        script: |
          set -euo pipefail

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/* || true

      - name: Build IPA
        script: |
          set -euo pipefail

          ARCHIVE_PATH="build/ios/xcarchive/App.xcarchive"
          EXPORT_PATH="build/ios/ipa"

          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"

          echo "Using MARKETING_VERSION=${MARKETING_VERSION}"
          echo "Using CURRENT_PROJECT_VERSION=${BUILD_NUM}"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            archive

          echo "=== ARCHIVE VERSION APPLE SEES ==="

          /usr/libexec/PlistBuddy \
            -c "Print :ApplicationProperties:CFBundleShortVersionString" \
            "$ARCHIVE_PATH/Info.plist" || true

          /usr/libexec/PlistBuddy \
            -c "Print :ApplicationProperties:CFBundleVersion" \
            "$ARCHIVE_PATH/Info.plist" || true

          cat > export_options.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>

            <key>teamID</key>
            <string>VQGPM443U5</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.xpressomedic.scenarioapp</key>
              <string>XpressoMedic Scenarios App Store Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist export_options.plist \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "=== GENERATED IPA ==="
          ls -lh "$EXPORT_PATH"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
