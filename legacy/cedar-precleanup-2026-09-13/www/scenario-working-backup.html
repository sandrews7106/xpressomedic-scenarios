<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <title>Cedar Hollow Scenario — XpressoMedic</title>

  <link rel="stylesheet" href="css/style.css"/>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    .scenario-screen {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding-top: var(--safe-top);
    }

    .scenario-page-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        16px
        max(16px, var(--safe-right))
        calc(22px + var(--safe-bottom))
        max(16px, var(--safe-left));
    }

    .scenario-inner {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .scenario-top-card {
      background: linear-gradient(135deg, var(--card), var(--panel));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .scenario-location-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.05);
      font-size: 26px;
    }

    .scenario-location-copy {
      flex: 1;
      min-width: 0;
    }

    .scenario-location-name {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      font-size: 1.35rem;
      letter-spacing: 1.5px;
      line-height: 1.05;
    }

    .scenario-location-meta {
      color: var(--muted);
      font-size: .68rem;
      margin-top: 4px;
      line-height: 1.45;
    }

    .scenario-counter {
      margin-top: 7px;
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .61rem;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .scenario-empty {
      margin-top: 36px;
      padding: 28px 20px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
    }

    .scenario-empty .empty-icon {
      font-size: 2.6rem;
      margin-bottom: 12px;
    }

    .scenario-empty h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .scenario-empty p {
      font-size: .78rem;
      line-height: 1.65;
    }

    .scenario-map-return {
      width: 100%;
      margin-top: 14px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--gold2);
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scenario-nav-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .scenario-nav-row .btn {
      min-height: 42px;
    }

    @media (max-width: 640px) {
      .scenario-page-body {
        padding-top: 12px;
      }

      .scenario-top-card {
        padding: 12px;
      }

      .scenario-location-name {
        font-size: 1.15rem;
      }

      .scenario-nav-row {
        position: sticky;
        bottom: 0;
        z-index: 20;
        padding: 10px 0 calc(6px + var(--safe-bottom));
        background:
          linear-gradient(
            to bottom,
            rgba(13,17,23,0),
            var(--bg) 20%
          );
      }
    }
  </style>
</head>

<body>

<div class="scenario-screen">

  <div class="app-header">
    <button
      class="header-back"
      id="backToMap"
      aria-label="Back to Cedar Hollow">
      ←
    </button>

    <div class="header-center">
      <div class="header-title">Cedar Hollow</div>
      <div class="header-sub" id="headerSub">EMS Training Scenario</div>
    </div>

    <div class="header-badge" id="levelBadge">EMT-B</div>
  </div>

  <main class="scenario-page-body" id="scenarioPageBody">
    <div class="scenario-inner" id="scenarioRoot"></div>
  </main>

</div>

<script src="js/scenarios-emtb.js"></script>
<script src="js/scenarios-aemt.js"></script>
<script src="js/scenarios-medic.js"></script>
<script src="js/scenario.js"></script>

</body>
</html>
