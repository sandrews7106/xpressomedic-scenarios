<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Cedar Hollow — XpressoMedic</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117}
    body{overscroll-behavior:none}
    .map-screen{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#0d1117}
    .cedar-map-wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#0d1420}
    #mapViewport{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
    #town{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
    .map-controls{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:grid;gap:8px}
    .map-control-btn{width:46px;height:46px;border:1px solid #33465a;border-radius:12px;background:rgba(13,20,32,.95);color:#fff;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.32)}
    .map-control-btn.reset{font-size:18px}
    .map-help{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;max-width:270px;padding:9px 11px;border:1px solid #26394c;border-radius:10px;background:rgba(13,20,32,.9);color:#a9bacb;font:600 12px/1.35 Inter,system-ui,sans-serif;backdrop-filter:blur(8px)}
    .pin-group{cursor:pointer;transition:opacity .15s ease,transform .12s ease;transform-box:fill-box;transform-origin:center}
    .pin-group:active{opacity:.75;transform:scale(.96)}
    .location-label{fill:#e3ebf4;font:700 9.2px Inter,system-ui,sans-serif;letter-spacing:.25px;paint-order:stroke;stroke:#0d1420;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
    .district-label{fill:#314253;font:700 9px Inter,system-ui,sans-serif;letter-spacing:1.2px}
    @media(max-width:700px){
      .header-sub{display:none}
      .header-title{font-size:17px}
      .map-help{
        left:50%;
        right:auto;
        top:8px;
        bottom:auto;
        transform:translateX(-50%);
        max-width:none;
        width:max-content;
        padding:6px 9px;
        font-size:10px;
        line-height:1.2;
        white-space:nowrap;
        pointer-events:none
      }
      .map-help{font-size:0}
      .map-help::after{
        content:"Drag • Pinch to zoom • Tap a location";
        font-size:10px
      }
      .map-controls{
        right:10px;
        bottom:calc(12px + env(safe-area-inset-bottom))
      }
      .map-control-btn{
        width:44px;
        height:44px
      }
      .location-label{
        font-size:8.6px;
        stroke-width:2.6px
      }
    }
  
    /* ── CEDAR HOLLOW LIGHT MODE ───────────────────────── */
    [data-theme="light"] html,
    [data-theme="light"] body,
    [data-theme="light"] .map-screen,
    [data-theme="light"] .cedar-map-wrap {
      background:#f5f0e8;
    }

    /* Main map canvas */
    [data-theme="light"] #town > rect[fill="#0d1420"] {
      fill:#f5f0e8;
    }

    /* Neighborhood blocks */
    [data-theme="light"] #town > rect[fill="#111c25"] {
      fill:#e8e2d8;
    }

    /* Park */
    [data-theme="light"] #town > rect[fill="#0a2614"] {
      fill:#dcebd8;
    }

    [data-theme="light"] #town ellipse[stroke="#1e6230"] {
      stroke:#5f9b62;
    }

    /* Roads */
    [data-theme="light"] #town line[stroke="#2a3a4a"] {
      stroke:#c7d0d8;
    }

    [data-theme="light"] #town line[stroke="#45617d"] {
      stroke:#8796a5;
    }

    /* District and road names */
    [data-theme="light"] .district-label {
      fill:#7b746c;
    }

    [data-theme="light"] #town text[fill="#6c8298"] {
      fill:#6b7280;
    }

    [data-theme="light"] #town text[fill="#3ea75a"] {
      fill:#347a43;
    }

    /* Location labels */
    [data-theme="light"] .location-label {
      fill:#1f2937;
      stroke:#f5f0e8;
    }

    /* Help strip */
    [data-theme="light"] .map-help {
      background:rgba(255,255,255,.92);
      border-color:#d1c9be;
      color:#4b5563;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }

    /* Zoom / reset controls */
    [data-theme="light"] .map-control-btn {
      background:rgba(255,255,255,.96);
      border-color:#c8c1b7;
      color:#29313a;
      box-shadow:0 5px 16px rgba(0,0,0,.12);
    }

  </style>
</head>
<body>
<div class="map-screen">

        <rect x="278" y="218" width="264" height="112" rx="18" fill="#0a2614"/>

        <text x="485" y="298" font-size="20">🌳</text>
        <text x="410" y="289" text-anchor="middle" font-size="18">⛲</text>

        <line x1="20" y1="200" x2="800" y2="200" stroke="#2a3a4a" stroke-width="28" stroke-linecap="round"/>
        <line x1="20" y1="350" x2="800" y2="350" stroke="#2a3a4a" stroke-width="28" stroke-linecap="round"/>
        <line x1="260" y1="20" x2="260" y2="540" stroke="#2a3a4a" stroke-width="28" stroke-linecap="round"/>
        <line x1="550" y1="20" x2="550" y2="540" stroke="#2a3a4a" stroke-width="28" stroke-linecap="round"/>

        <line x1="20" y1="200" x2="800" y2="200" stroke="#45617d" stroke-width="1.5" stroke-dasharray="18 14"/>
        <line x1="20" y1="350" x2="800" y2="350" stroke="#45617d" stroke-width="1.5" stroke-dasharray="18 14"/>
        <line x1="260" y1="20" x2="260" y2="540" stroke="#45617d" stroke-width="1.5" stroke-dasharray="18 14"/>
        <line x1="550" y1="20" x2="550" y2="540" stroke="#45617d" stroke-width="1.5" stroke-dasharray="18 14"/>

        <text x="410" y="192" text-anchor="middle" fill="#6c8298" font-size="9" font-family="Inter" font-weight="700" letter-spacing="1.4">CEDAR AVENUE</text>

        <text x="251" y="280" transform="rotate(-90 251 280)" text-anchor="middle" fill="#6c8298" font-size="9" font-family="Inter" font-weight="700" letter-spacing="1.4">NORTH STREET</text>
        <text x="541" y="280" transform="rotate(-90 541 280)" text-anchor="middle" fill="#6c8298" font-size="9" font-family="Inter" font-weight="700" letter-spacing="1.4">MARKET STREET</text>

        <g class="pin-group" data-id="cedar_school" filter="url(#pinShadow)">

        </g>

          <circle cx="175" cy="115" r="24" fill="#2980b9"/><text x="175" y="122" text-anchor="middle" font-size="20">🏊</text><text x="175" y="151" text-anchor="middle" class="location-label"><tspan x="175">COMMUNITY</tspan><tspan x="175" dy="11">POOL</tspan></text>
        </g>
        <g class="pin-group" data-id="cedar_family_medicine" filter="url(#pinShadow)">
          <circle cx="345" cy="112" r="24" fill="#2980b9"/><text x="345" y="119" text-anchor="middle" font-size="20">🩺</text><text x="345" y="151" text-anchor="middle" class="location-label">FAMILY MEDICINE</text>
        </g>
        <g class="pin-group" data-id="cedar_care" filter="url(#pinShadow)">
          <circle cx="455" cy="112" r="24" fill="#2980b9"/><text x="455" y="119" text-anchor="middle" font-size="20">🏥</text><text x="455" y="151" text-anchor="middle" class="location-label">CEDAR CARE</text>
        </g>
        <g class="pin-group" data-id="cedar_athletics" filter="url(#pinShadow)">
          <circle cx="625" cy="112" r="24" fill="#d35400"/><text x="625" y="119" text-anchor="middle" font-size="20">🏟️</text><text x="625" y="148" text-anchor="middle" class="location-label"><tspan x="625">ATHLETIC</tspan><tspan x="625" dy="11">COMPLEX</tspan></text>
        </g>
        <g class="pin-group" data-id="cedar_apartments" filter="url(#pinShadow)">
          <circle cx="720" cy="112" r="24" fill="#27ae60"/><text x="720" y="119" text-anchor="middle" font-size="20">🏢</text><text x="720" y="151" text-anchor="middle" class="location-label">APARTMENTS</text>
        </g>
        <g class="pin-group" data-id="cedar_park" filter="url(#pinShadow)">

        </g>

        </g>
        <g class="pin-group" data-id="cedar_quick_mart" filter="url(#pinShadow)">
          <circle cx="345" cy="445" r="24" fill="#27ae60"/><text x="345" y="452" text-anchor="middle" font-size="20">⛽</text><text x="345" y="485" text-anchor="middle" class="location-label">QUICK MART</text>
        </g>
        <g class="pin-group" data-id="cedar_market" filter="url(#pinShadow)">
          <circle cx="455" cy="445" r="24" fill="#27ae60"/><text x="455" y="452" text-anchor="middle" font-size="20">🛒</text><text x="455" y="485" text-anchor="middle" class="location-label">CEDAR MARKET</text>
        </g>
        <g class="pin-group" data-id="oakwood_estates" filter="url(#pinShadow)">
          <circle cx="680" cy="445" r="24" fill="#27ae60"/><text x="680" y="452" text-anchor="middle" font-size="20">🏡</text><text x="680" y="481" text-anchor="middle" class="location-label"><tspan x="680">OAKWOOD</tspan><tspan x="680" dy="11">ESTATES</tspan></text>
        </g>
      </svg>
    </div>

    <div class="map-help">Drag to move • Pinch or use + / − to zoom • Tap a location to start a scenario</div>

    <div class="map-controls">
      <button class="map-control-btn" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="map-control-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="map-control-btn reset" id="resetMap" aria-label="Reset map">⌂</button>
    </div>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const level = params.get('level') || 'emtb';
  const levelLabels = { emtb:'EMT-B', aemt:'AEMT', medic:'PARAMEDIC' };
  document.getElementById('levelBadge').textContent = levelLabels[level] || 'EMT-B';

  document.querySelectorAll('.pin-group').forEach(pin => {
    pin.addEventListener('click', event => {
      event.stopPropagation();
      const locationId = pin.dataset.id;
      window.location.href =
        `scenario.html?town=cedar_hollow&level=${encodeURIComponent(level)}&location=${encodeURIComponent(locationId)}`;
    });
  });

  const wrap = document.getElementById('mapWrap');
  const viewport = document.getElementById('mapViewport');

  let scale = 1, x = 0, y = 0;
  const MIN_SCALE = 1, MAX_SCALE = 3.5;

  function applyTransform() {
    viewport.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }

  function clampPan() {
    const rect = wrap.getBoundingClientRect();
    const scaledW = rect.width * scale;
    const scaledH = rect.height * scale;
    const minX = Math.min(0, rect.width - scaledW);
    const minY = Math.min(0, rect.height - scaledH);
    x = Math.min(0, Math.max(minX, x));
    y = Math.min(0, Math.max(minY, y));
  }

  function zoomAt(factor, cx, cy) {
    const oldScale = scale;
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, oldScale * factor));
    if (newScale === oldScale) return;
    const ratio = newScale / oldScale;
    x = cx - (cx - x) * ratio;
    y = cy - (cy - y) * ratio;
    scale = newScale;
    clampPan();
    applyTransform();
  }

  document.getElementById('zoomIn').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1.3, r.width/2, r.height/2);
  });

  document.getElementById('zoomOut').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1/1.3, r.width/2, r.height/2);
  });

  document.getElementById('resetMap').addEventListener('click', () => {
    scale = 1; x = 0; y = 0; applyTransform();
  });

  let dragging = false, lastX = 0, lastY = 0;

  wrap.addEventListener('pointerdown', e => {
    // Location pins and map controls are taps/clicks, not map drags.
    if (
      e.target.closest?.('.pin-group') ||
      e.target.closest?.('.map-controls') ||
      e.target.closest?.('.map-control-btn')
    ) {
      return;
    }

    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    wrap.setPointerCapture?.(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!dragging || scale <= 1) return;
    x += e.clientX - lastX;
    y += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    clampPan();
    applyTransform();
  });

  wrap.addEventListener('pointerup', () => dragging = false);
  wrap.addEventListener('pointercancel', () => dragging = false);

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive:false });

  let pinchStartDistance = null;
  let pinchStartScale = 1;

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const [a,b] = e.touches;
      pinchStartDistance = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      pinchStartScale = scale;
    }
  }, { passive:false });

  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDistance) {
      e.preventDefault();
      const [a,b] = e.touches;
      const currentDistance = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      const rect = wrap.getBoundingClientRect();
      const cx = ((a.clientX+b.clientX)/2) - rect.left;
      const cy = ((a.clientY+b.clientY)/2) - rect.top;
      const targetScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * (currentDistance/pinchStartDistance)));
      zoomAt(targetScale/scale, cx, cy);
    }
  }, { passive:false });

  wrap.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinchStartDistance = null;
  });

  applyTransform();
})();
</script>
</body>
</html>
