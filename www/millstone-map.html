<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Millstone — XpressoMedic</title>

  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/theme.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#101214;
    }

    body{
      overscroll-behavior:none;
    }

    .map-screen{
      height:100vh;
      height:100dvh;
      display:flex;
      flex-direction:column;
      background:#101214;
    }

    .millstone-map-wrap{
      position:relative;
      flex:1;
      min-height:0;
      overflow:hidden;
      touch-action:none;
      background:#16191c;
    }

    #mapViewport{
      position:absolute;
      inset:0;
      transform-origin:0 0;
      will-change:transform;
    }

    #town{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      user-select:none;
      -webkit-user-select:none;
    }

    .map-controls{
      position:absolute;
      right:14px;
      bottom:calc(18px + env(safe-area-inset-bottom));
      z-index:30;
      display:grid;
      gap:8px;
    }

    .map-control-btn{
      width:46px;
      height:46px;
      border:1px solid #4c4f52;
      border-radius:12px;
      background:rgba(20,22,24,.95);
      color:#fff;
      font-size:24px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.38);
    }

    .map-control-btn.reset{
      font-size:18px;
    }

    .map-help{
      position:absolute;
      left:12px;
      bottom:calc(14px + env(safe-area-inset-bottom));
      z-index:25;
      max-width:290px;
      padding:9px 11px;
      border:1px solid #48433d;
      border-radius:10px;
      background:rgba(22,24,26,.92);
      color:#b7b2aa;
      font:600 12px/1.35 Inter,system-ui,sans-serif;
      backdrop-filter:blur(8px);
    }

    .pin-group{
      cursor:pointer;
      transition:opacity .15s ease,transform .12s ease;
      transform-box:fill-box;
      transform-origin:center;
    }

    .pin-group:active{
      opacity:.75;
      transform:scale(.96);
    }

    .location-label{
      fill:#f0ebe3;
      font:700 8.8px Inter,system-ui,sans-serif;
      letter-spacing:.2px;
      paint-order:stroke;
      stroke:#16191c;
      stroke-width:3px;
      stroke-linejoin:round;
      pointer-events:none;
    }

    .district-label{
      fill:#665f57;
      font:800 9px Inter,system-ui,sans-serif;
      letter-spacing:1.5px;
    }

    .road-label{
      fill:#8b8175;
      font:700 8px Inter,system-ui,sans-serif;
      letter-spacing:1.2px;
    }

    .industrial-block{
      fill:#202428;
      stroke:#30353a;
      stroke-width:1;
    }

    .commercial-block{
      fill:#1d2225;
      stroke:#30353a;
      stroke-width:1;
    }

    .yard-fill{
      fill:#262522;
    }

    .river-fill{
      fill:#102a34;
    }

    .river-edge{
      fill:none;
      stroke:#29576b;
      stroke-width:3;
    }

    .highway{
      fill:none;
      stroke:#35383b;
      stroke-width:38;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .highway-line{
      fill:none;
      stroke:#c08a48;
      stroke-width:1.6;
      stroke-dasharray:18 13;
      opacity:.85;
    }

    .secondary-road{
      fill:none;
      stroke:#303438;
      stroke-width:22;
      stroke-linecap:round;
    }

    .secondary-line{
      fill:none;
      stroke:#686e74;
      stroke-width:1.2;
      stroke-dasharray:14 11;
    }

    .rail{
      fill:none;
      stroke:#7a7065;
      stroke-width:3;
    }

    .rail-tie{
      fill:none;
      stroke:#4d4944;
      stroke-width:7;
      stroke-dasharray:4 7;
    }

    .runway{
      fill:#292d30;
      stroke:#50555a;
      stroke-width:1;
    }

    .runway-center{
      stroke:#a7a7a3;
      stroke-width:1.5;
      stroke-dasharray:16 12;
    }

    .map-note{
      fill:#776d62;
      font:700 8px Inter,system-ui,sans-serif;
      letter-spacing:1px;
    }

    @media(max-width:700px){
      .header-sub{display:none}
      .header-title{font-size:17px}

      .map-help{
        left:50%;
        right:auto;
        top:8px;
        bottom:auto;
        transform:translateX(-50%);
        max-width:none;
        width:max-content;
        padding:6px 9px;
        font-size:0;
        line-height:1.2;
        white-space:nowrap;
        pointer-events:none;
      }

      .map-help::after{
        content:"Drag • Pinch to zoom • Tap a location";
        font-size:10px;
      }

      .map-controls{
        right:10px;
        bottom:calc(12px + env(safe-area-inset-bottom));
      }

      .map-control-btn{
        width:44px;
        height:44px;
      }

      .location-label{
        font-size:8.1px;
        stroke-width:2.5px;
      }
    }

    [data-theme="light"] html,
    [data-theme="light"] body,
    [data-theme="light"] .map-screen,
    [data-theme="light"] .millstone-map-wrap{
      background:#eeeae3;
    }

    [data-theme="light"] #town .map-background{
      fill:#eeeae3;
    }

    [data-theme="light"] .industrial-block{
      fill:#d8d6d1;
      stroke:#c1bdb6;
    }

    [data-theme="light"] .commercial-block{
      fill:#e1ddd6;
      stroke:#c8c3ba;
    }

    [data-theme="light"] .yard-fill{
      fill:#d5d0c6;
    }

    [data-theme="light"] .river-fill{
      fill:#cfe4ea;
    }

    [data-theme="light"] .river-edge{
      stroke:#79a9b8;
    }

    [data-theme="light"] .highway{
      stroke:#b6b8ba;
    }

    [data-theme="light"] .secondary-road{
      stroke:#c2c4c5;
    }

    [data-theme="light"] .rail{
      stroke:#786f66;
    }

    [data-theme="light"] .rail-tie{
      stroke:#aaa39b;
    }

    [data-theme="light"] .runway{
      fill:#bfc2c3;
      stroke:#a9adaf;
    }

    [data-theme="light"] .district-label,
    [data-theme="light"] .road-label,
    [data-theme="light"] .map-note{
      fill:#716a62;
    }

    [data-theme="light"] .location-label{
      fill:#252525;
      stroke:#eeeae3;
    }

    [data-theme="light"] .map-help{
      background:rgba(255,255,255,.94);
      border-color:#c9c3ba;
      color:#4b5563;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }

    [data-theme="light"] .map-control-btn{
      background:rgba(255,255,255,.96);
      border-color:#c4beb5;
      color:#29313a;
      box-shadow:0 5px 16px rgba(0,0,0,.12);
    }
  </style>
</head>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const level = params.get('level') || 'emtb';

  const levelLabels = {
    emtb:'EMT-B',
    aemt:'AEMT',
    medic:'PARAMEDIC'
  };

  const badge = document.getElementById('levelBadge');
  badge.textContent = levelLabels[level] || 'EMT-B';
  badge.className = 'header-badge ' + level;

  document.getElementById('backToTowns').addEventListener('click', () => {
    window.location.href =
      'towns.html?level=' + encodeURIComponent(level);
  });

  document.querySelectorAll('.pin-group').forEach(pin => {
    pin.addEventListener('click', event => {
      event.stopPropagation();

      const locationId =
        pin.dataset.id;

      window.location.href =
        `scenario.html?town=millstone&level=${encodeURIComponent(level)}&location=${encodeURIComponent(locationId)}`;
    });
  });

  const wrap = document.getElementById('mapWrap');
  const viewport = document.getElementById('mapViewport');

  let scale = 1;
  let x = 0;
  let y = 0;

  const MIN_SCALE = 1;
  const MAX_SCALE = 3.5;

  function applyTransform() {
    viewport.style.transform =
      `translate(${x}px, ${y}px) scale(${scale})`;
  }

  function clampPan() {
    const rect = wrap.getBoundingClientRect();

    const scaledW = rect.width * scale;
    const scaledH = rect.height * scale;

    const minX = Math.min(0, rect.width - scaledW);
    const minY = Math.min(0, rect.height - scaledH);

    x = Math.min(0, Math.max(minX, x));
    y = Math.min(0, Math.max(minY, y));
  }

  function zoomAt(factor, cx, cy) {
    const oldScale = scale;

    const newScale = Math.max(
      MIN_SCALE,
      Math.min(
        MAX_SCALE,
        oldScale * factor
      )
    );

    if (newScale === oldScale) return;

    const ratio = newScale / oldScale;

    x = cx - (cx - x) * ratio;
    y = cy - (cy - y) * ratio;

    scale = newScale;

    clampPan();
    applyTransform();
  }

  document.getElementById('zoomIn').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1.3, r.width/2, r.height/2);
  });

  document.getElementById('zoomOut').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1/1.3, r.width/2, r.height/2);
  });

  document.getElementById('resetMap').addEventListener('click', () => {
    scale = 1;
    x = 0;
    y = 0;
    applyTransform();
  });

  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  wrap.addEventListener('pointerdown', e => {
    if (
      e.target.closest?.('.pin-group') ||
      e.target.closest?.('.map-controls') ||
      e.target.closest?.('.map-control-btn')
    ) {
      return;
    }

    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;

    wrap.setPointerCapture?.(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!dragging || scale <= 1) return;

    x += e.clientX - lastX;
    y += e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    clampPan();
    applyTransform();
  });

  wrap.addEventListener('pointerup', () => dragging = false);
  wrap.addEventListener('pointercancel', () => dragging = false);

  wrap.addEventListener('wheel', e => {
    e.preventDefault();

    const rect = wrap.getBoundingClientRect();

    zoomAt(
      e.deltaY < 0 ? 1.18 : 1/1.18,
      e.clientX - rect.left,
      e.clientY - rect.top
    );
  }, { passive:false });

  let pinchStartDistance = null;
  let pinchStartScale = 1;

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const [a,b] = e.touches;

      pinchStartDistance = Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      pinchStartScale = scale;
    }
  }, { passive:false });

  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDistance) {
      e.preventDefault();

      const [a,b] = e.touches;

      const currentDistance = Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      const rect = wrap.getBoundingClientRect();

      const cx =
        ((a.clientX+b.clientX)/2) - rect.left;

      const cy =
        ((a.clientY+b.clientY)/2) - rect.top;

      const targetScale = Math.max(
        MIN_SCALE,
        Math.min(
          MAX_SCALE,
          pinchStartScale *
          (currentDistance/pinchStartDistance)
        )
      );

      zoomAt(
        targetScale/scale,
        cx,
        cy
      );
    }
  }, { passive:false });

  wrap.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      pinchStartDistance = null;
    }
  });

  applyTransform();
})();
